spring:
  application:
    name: datafrog-server
  # PostgreSQL 数据源（014-data-01 数据对象存储模块启用；环境变量由部署环境注入，
  # 形态与 alphafrog 各业务服务一致）。元数据建表脚本 db/datafrog-objectstore-v1.sql
  # 由部署链路在进程启动前执行，进程启动时 InitialDefinitionLoader 查表缺失即失败（fail-closed）。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AF_DB_MAIN_HOST}:${AF_DB_MAIN_PORT}/${AF_DB_MAIN_DATABASE}
    username: ${AF_DB_MAIN_USER}
    password: ${AF_DB_MAIN_PASSWORD}

# 014-data-01 数据对象存储：内容（Parquet part 与导出文件）的数据根目录，
# 相对路径按进程工作目录解析，生产由部署环境注入绝对路径。
datafrog:
  objectstore:
    data-root: ${DATAFROG_OBJECTSTORE_DATA_ROOT:data/objectstore}

# 预留：Redis。启用时同步取消 pom.xml 中 spring-boot-starter-data-redis 的注释。
#   data:
#     redis:
#       host: ${AF_REDIS_HOST:127.0.0.1}
#       port: 6379
#       password: ${AF_REDIS_PASSWORD:default}

dubbo:
  application:
    name: datafrog-server
    # 与 alphafrog 集群一致：沿用 Dubbo 2 风格的接口级服务发现，显式关闭 Dubbo 3 默认的应用级双注册/双订阅
    register-mode: interface
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    # 当前未使用 Nacos 作为 Dubbo 配置中心，显式关闭该默认行为，避免启动时额外做 config-center 健康检查
    use-as-config-center: false
    # 当前未使用 Nacos 作为 Dubbo 元数据中心，显式关闭该默认行为，避免启动时额外做 metadata-center 健康检查
    use-as-metadata-center: false
    # 带账号形态（部署环境需要时启用）：
    # address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848?username=${NACOS_USER:nacos}&password=${NACOS_PASSWORD:nacos}
  protocol:
    name: tri
    # DataFrog 首个 tri 端口。alphafrog 已占用 50052-50062 与 20882，50070 登记给本服务。
    port: 50070
  consumer:
    check: false

# 预留：热配置。alphafrog 使用 common 模块的自研 NacosConfigBridge（属性前缀 alphafrog.config.nacos，
# Beta 组 alphafrog-beta-config、生产组 alphafrog-config）。DataFrog 接入热配置时从 alphafrog common
# 复制该桥或抽共享库，组名（datafrog-config / datafrog-beta-config）由运维工具改造时一并登记。

# 泳道说明：应用零代码。泳道身份由 Beta 部署控制器经环境变量注入
# （AF_LANE_TRAFFIC_SCOPE_ID，以及 dubbo.provider.parameters 里的 dubbo.tag 键），
# 本服务与 alphafrog 既有服务同形态，部署进泳道后自动参与标签路由。
